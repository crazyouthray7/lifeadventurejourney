<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1018">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="人生冒險誌｜從出生到終幕，一場屬於你的人生。零抽卡、零課金，純文字的人生模擬器。">
  <title>人生冒險誌｜人生模擬器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Ccircle cx='48' cy='48' r='46' fill='%230a1018'/%3E%3Ccircle cx='48' cy='48' r='38' fill='%23e8c36f'/%3E%3Ctext x='48' y='60' font-size='36' text-anchor='middle' font-family='serif' fill='%230a1018'%3E%E7%94%9F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./themes/life/style.css">
</head>
<body>
  <div id="app">
    <aside id="timeline">
      <div class="timelineBrand">
        <span class="coinMark" aria-hidden="true">生</span>
        <div class="brandText">
          <span class="brandTitle">人生冒險誌</span>
          <span class="brandCredit">Produce By: CrazyRL7</span>
        </div>
      </div>
      <ol id="timelineList"></ol>
    </aside>

    <main id="main">
      <header id="board">
        <div id="boardMeta"></div>
        <div class="stats" id="stats"></div>
        <div id="traits"></div>
        <div id="charPanel"></div>
      </header>
      <section id="log"></section>
    </main>

    <section id="actions">
      <h2 id="actionTitle"></h2>
      <div id="actionBody"></div>
    </section>

    <footer class="footerCredit">Produce By: CrazyRL7</footer>
  </div>

  <div id="modal" aria-hidden="true">
    <div class="modalBox" id="modalBox" role="dialog" aria-modal="true"></div>
  </div>

  <section id="start">
    <div class="startPanel">
      <div class="heroCoin" aria-hidden="true">生</div>
      <h1 class="heroTitle">人生<em>冒險</em>誌</h1>
      <p class="heroSub">從出生到終幕，一場屬於你的人生</p>
      <span class="creditTag">Produce By: CrazyRL7</span>

      <form id="startForm" novalidate>
        <div class="field">
          <label class="fieldLabel" for="nameInput">你的名字</label>
          <input id="nameInput" name="name" type="text" maxlength="12" placeholder="輸入名字，開始你的人生" autocomplete="off">
        </div>

        <fieldset class="field">
          <legend class="fieldLabel">出生城市</legend>
          <div class="seg">
            <label class="segBtn"><input type="radio" name="city" value="taipei" checked><span class="segText">台北</span></label>
            <label class="segBtn"><input type="radio" name="city" value="taichung"><span class="segText">台中</span></label>
            <label class="segBtn"><input type="radio" name="city" value="kaohsiung"><span class="segText">高雄</span></label>
            <label class="segBtn"><input type="radio" name="city" value="other"><span class="segText">其他</span></label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend class="fieldLabel">家境</legend>
          <div class="seg segStack">
            <label class="segBtn segCard">
              <input type="radio" name="family" value="poor">
              <span class="segTitle">清貧</span>
              <span class="segSub">路邊攤、打零工，錢要省著花</span>
            </label>
            <label class="segBtn segCard">
              <input type="radio" name="family" value="middle" checked>
              <span class="segTitle">小康</span>
              <span class="segSub">朝九晚五的上班族，剛好夠用</span>
            </label>
            <label class="segBtn segCard">
              <input type="radio" name="family" value="rich">
              <span class="segTitle">富裕</span>
              <span class="segSub">經營家族事業，資源不虞匱乏</span>
            </label>
          </div>
        </fieldset>

        <div class="seedRow">
          <span class="seedLabel">種子</span>
          <span id="seedText" class="seedValue mono">————</span>
          <button type="button" id="seedRe" class="seedRe">重骰</button>
        </div>

        <button type="submit" class="startBtn">開始人生</button>
        <button type="button" id="continueBtn" class="continueBtn" hidden>繼續上次人生</button>
      </form>
    </div>
  </section>

  <section id="finale" hidden>
    <!-- Produce By: CrazyRL7 -->
    <div class="finaleCredit">Produce By: CrazyRL7</div>
  </section>

  <noscript>請啟用 JavaScript，開始你的人生。</noscript>

  <script type="module" src="./engine/boot.js"></script>
</body>
</html>
